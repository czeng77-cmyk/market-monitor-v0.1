name: Weekly earnings update
on:
  schedule:
    - cron: "0 0 * * 0"   # Sunday 00:00 UTC = Sunday 08:00 Beijing
  workflow_dispatch:
permissions:
  contents: write
jobs:
  earnings:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: { python-version: "3.12", cache: pip }
      - run: pip install -r requirements.txt
      - run: python earnings_update.py
      - name: Save results
        run: |
          git config user.name "daily-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data/
          git diff --staged --quiet || (git commit -m "Weekly earnings update" && git push)
