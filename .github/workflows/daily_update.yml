name: Daily stock update
on:
  schedule:
    - cron: "30 21 * * 1-5"   # 21:30 UTC Mon-Fri = 05:30 Beijing next day (after US close)
  workflow_dispatch:           # lets you run it manually from the Actions tab
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: { python-version: "3.12", cache: pip }
      - run: pip install -r requirements.txt
      - run: python update_data.py
      - name: Collect news for top movers
        run: python news_update.py
        continue-on-error: true
      - name: Save results
        run: |
          git config user.name "daily-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data/
          git diff --staged --quiet || (git commit -m "Update data" && git push)
