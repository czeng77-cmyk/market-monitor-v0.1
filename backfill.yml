name: Backfill prices
on:
  workflow_dispatch:
    inputs:
      days:
        description: "How many past trading days to load"
        default: "30"
permissions:
  contents: write
jobs:
  backfill:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: { python-version: "3.12", cache: pip }
      - run: pip install -r requirements.txt
      - run: python backfill_prices.py ${{ github.event.inputs.days }}
      - name: Save results
        run: |
          git config user.name "daily-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data/
          git diff --staged --quiet || (git commit -m "Backfill prices" && git push)
